<!--
    沉没的十七岁：高三一年
    ============================
    一个关于高三的纯前端文字游戏。

    背景图片来源：
        Unsplash (https://unsplash.com)
        依据 Unsplash License 使用：
        https://unsplash.com/license
        免费用于商业及非商业用途，无需署名（此声明出于尊重）。

    孔老师部分情节来自真实经历。

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>沉没的十七岁：高三一年</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #0a0a0a; color: #a0a0a0;
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            min-height: 100vh; overflow-y: auto; overflow-x: hidden;
            background-size: cover; background-position: center;
            background-attachment: fixed;
            transition: background-image 2s ease-in-out;
            position: relative; padding: 20px 0;
        }
        body::before {
            content: ''; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(10, 10, 10, 0.85); z-index: 0;
            backdrop-filter: blur(3px);
        }
        #name-screen {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: #0a0a0a; z-index: 200;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            gap: 20px; padding: 30px;
        }
        #name-screen h1 { font-size: 24px; letter-spacing: 8px; color: #d3a75e; font-weight: normal; }
        #name-screen p { font-size: 14px; color: #666; letter-spacing: 2px; }
        #name-screen input {
            background: #1a1a1a; border: 1px solid #333; color: #ddd;
            padding: 12px 20px; font-size: 16px; text-align: center;
            border-radius: 2px; font-family: inherit; width: 200px;
            outline: none; transition: border-color 0.3s;
        }
        #name-screen input:focus { border-color: #8a6d3b; }
        #name-screen button {
            background: rgba(138, 109, 59, 0.3); border: 1px solid #8a6d3b;
            color: #d3c0a0; padding: 10px 40px; font-size: 14px; cursor: pointer;
            border-radius: 2px; font-family: inherit; transition: all 0.3s;
        }
        #name-screen button:hover { background: rgba(138, 109, 59, 0.6); color: #fff; }

        #game-container {
            width: 100%; max-width: 520px; padding: 15px;
            display: flex; flex-direction: column; gap: 12px;
            z-index: 1; position: relative;
            min-height: 100vh; margin: 0 auto; padding-bottom: 60px;
        }
        .top-bar { display: flex; justify-content: space-between; margin-bottom: -5px; flex-wrap: wrap; gap: 5px; }
        .top-btn {
            background: rgba(255,255,255,0.05); border: 1px solid #333;
            color: #666; font-size: 11px; padding: 4px 10px;
            border-radius: 12px; cursor: pointer; font-family: inherit;
            transition: all 0.3s; position: relative;
        }
        .top-btn:hover { color: #aaa; border-color: #666; }
        .top-btn.active { color: #b8d8b8; border-color: #6b9e6b; background: rgba(107,158,107,0.15); }
        .top-btn .badge {
            position: absolute; top: -5px; right: -5px;
            background: #d35e5e; color: #fff; font-size: 9px;
            width: 14px; height: 14px; border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
        }

        #stats {
            display: flex; justify-content: space-between;
            font-size: 12px; border-bottom: 1px solid rgba(255,255,255,0.08);
            padding-bottom: 8px; letter-spacing: 1px; flex-shrink: 0;
        }
        .stat-item { display: flex; flex-direction: column; gap: 2px; align-items: center; }
        .stat-value { color: #e0e0e0; font-weight: bold; font-size: 15px; transition: color 0.3s; }
        .stat-high { color: #d35e5e; text-shadow: 0 0 8px rgba(211,94,94,0.6); }
        .stat-low { color: #5e8ed3; text-shadow: 0 0 8px rgba(94,142,211,0.6); }
        .stat-warm { color: #d3a75e; text-shadow: 0 0 8px rgba(211,167,94,0.6); }

        #subjects-panel {
            background: rgba(20, 20, 20, 0.8); border: 1px solid #333;
            padding: 12px; border-radius: 4px; display: none; flex-shrink: 0;
        }
        .subject-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 13px; }
        .subject-name { width: 45px; color: #999; }
        .subject-bar-bg { flex: 1; height: 5px; background: #222; margin: 0 10px; border-radius: 3px; overflow: hidden; }
        .subject-bar-fill { height: 100%; width: 0%; background: #5e8ed3; transition: width 0.5s ease; }
        .subject-val { width: 30px; text-align: right; font-weight: bold; color: #ddd; font-size: 13px; }

        #feed-scroll {
            max-height: 50vh; overflow-y: auto; padding-right: 5px;
            display: none; flex-direction: column; gap: 15px;
            scrollbar-width: thin; scrollbar-color: #333 transparent;
        }
        #feed-scroll::-webkit-scrollbar { width: 4px; }
        #feed-scroll::-webkit-scrollbar-thumb { background: #333; border-radius: 2px; }

        .feed-card {
            background: rgba(30, 30, 30, 0.6); border: 1px solid #2a2a2a;
            border-radius: 6px; padding: 15px; display: flex; gap: 12px;
            animation: fadeIn 0.6s ease;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .avatar {
            width: 40px; height: 40px; border-radius: 4px; flex-shrink: 0;
            display: flex; justify-content: center; align-items: center;
            font-size: 16px; font-weight: bold; color: #fff;
        }
        .avatar-blue { background: #4a6fa5; }
        .avatar-red { background: #a54a4a; }
        .avatar-green { background: #4a7a5a; }
        .avatar-grey { background: #555; }
        .avatar-gold { background: #8a6d3b; }
        
        .feed-content { flex: 1; }
        .feed-name { font-size: 14px; color: #8bb4e0; margin-bottom: 4px; font-weight: bold; }
        .feed-text { font-size: 14px; line-height: 1.6; color: #c0c0c0; margin-bottom: 8px; }
        .feed-meta { font-size: 11px; color: #666; display: flex; justify-content: space-between; margin-bottom: 10px; }
        
        .feed-actions { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
        .action-btn {
            background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
            color: #999; font-size: 12px; padding: 4px 10px; border-radius: 12px;
            cursor: pointer; transition: all 0.2s; font-family: inherit;
        }
        .action-btn:hover { background: rgba(255,255,255,0.15); color: #fff; }
        .action-btn:disabled { opacity: 0.4; cursor: not-allowed; }
        .action-btn.selected { background: rgba(107, 158, 107, 0.2); border-color: #6b9e6b; color: #b8d8b8; }

        .feed-replies { margin-top: 10px; padding-top: 10px; border-top: 1px dashed #333; font-size: 12px; color: #888; line-height: 1.6; display: none; }
        .feed-replies.show { display: block; }
        .feed-replies span { color: #8bb4e0; }

        #phone-screen {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: #0a0a0a; z-index: 300;
            display: none; flex-direction: column;
            padding: 20px;
        }
        #phone-header {
            display: flex; justify-content: space-between; align-items: center;
            padding-bottom: 15px; border-bottom: 1px solid #333;
            margin-bottom: 15px;
        }
        #phone-header h2 { font-size: 16px; color: #ddd; font-weight: normal; letter-spacing: 2px; }
        #phone-header button {
            background: none; border: none; color: #666; font-size: 20px;
            cursor: pointer; font-family: inherit;
        }
        #phone-header button:hover { color: #fff; }
        #phone-content { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
        .chat-item {
            display: flex; gap: 12px; padding: 12px;
            background: rgba(30,30,30,0.6); border: 1px solid #2a2a2a;
            border-radius: 6px; cursor: pointer; transition: all 0.2s;
        }
        .chat-item:hover { background: rgba(50,50,50,0.8); border-color: #555; }
        .chat-item .avatar { width: 40px; height: 40px; font-size: 16px; }
        .chat-info { flex: 1; }
        .chat-name { font-size: 14px; color: #ddd; margin-bottom: 4px; }
        .chat-preview { font-size: 12px; color: #888; }
        .chat-unread {
            width: 8px; height: 8px; border-radius: 50%;
            background: #d35e5e; align-self: center;
        }
        #chat-detail { display: none; flex-direction: column; flex: 1; }
        #chat-detail-header {
            display: flex; align-items: center; gap: 10px;
            padding-bottom: 15px; border-bottom: 1px solid #333;
            margin-bottom: 15px;
        }
        #chat-detail-header button {
            background: none; border: none; color: #666; font-size: 18px;
            cursor: pointer; font-family: inherit;
        }
        #chat-detail-header button:hover { color: #fff; }
        #chat-detail-header span { font-size: 14px; color: #ddd; }
        #chat-messages { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding-bottom: 15px; }
        .msg {
            max-width: 80%; padding: 10px 14px; border-radius: 6px;
            font-size: 13px; line-height: 1.6;
        }
        .msg.them { background: rgba(40,40,40,0.9); color: #bbb; align-self: flex-start; }
        .msg.me { background: rgba(107,158,107,0.3); color: #b8d8b8; align-self: flex-end; border: 1px solid #4a6a4a; }
        #chat-options { display: flex; flex-direction: column; gap: 8px; padding-top: 10px; border-top: 1px solid #333; }
        .chat-option-btn {
            background: rgba(30,30,30,0.8); border: 1px solid #333;
            color: #999; padding: 10px 14px; font-size: 13px;
            text-align: left; cursor: pointer; border-radius: 4px;
            font-family: inherit; transition: all 0.2s;
        }
        .chat-option-btn:hover { background: rgba(50,50,50,0.9); color: #fff; border-color: #555; }

        #relief-panel {
            background: rgba(20, 20, 20, 0.9); border: 1px solid #444;
            padding: 15px; border-radius: 4px; display: none; flex-direction: column; gap: 10px;
        }
        #relief-panel h3 { font-size: 14px; color: #d3a75e; font-weight: normal; margin-bottom: 5px; }
        .relief-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .relief-btn {
            background: rgba(30, 30, 30, 0.8); border: 1px solid #333;
            color: #999; padding: 10px; font-size: 13px; cursor: pointer;
            border-radius: 2px; font-family: inherit; transition: all 0.2s;
            text-align: center;
        }
        .relief-btn:hover { background: rgba(50, 50, 50, 0.9); color: #fff; border-color: #555; }
        .relief-btn.risky { border-color: #5a3a3a; color: #b08d8d; }
        .relief-btn.risky:hover { background: rgba(90, 58, 58, 0.5); border-color: #a54a4a; color: #e0a0a0; }
        .relief-btn.selected { border-color: #6b9e6b; background: rgba(60, 80, 60, 0.3); color: #b8d8b8; }

        #options { display: flex; flex-direction: column; gap: 10px; flex-shrink: 0; }
        .option-btn {
            background-color: rgba(30, 30, 30, 0.7); border: 1px solid rgba(255,255,255,0.1);
            color: #999; padding: 12px 16px; font-size: 14px;
            text-align: left; cursor: pointer; transition: all 0.2s;
            border-radius: 2px; font-family: inherit; backdrop-filter: blur(4px);
        }
        .option-btn:hover { background-color: rgba(50, 50, 50, 0.9); color: #fff; border-color: #555; }
        .option-btn.selected { border-color: #6b9e6b; background: rgba(60, 80, 60, 0.3); color: #b8d8b8; }
        .option-btn.warm { border-color: #8a6d3b; background: rgba(60, 50, 30, 0.3); color: #d3c0a0; }
        .option-btn.warm:hover { background: rgba(80, 65, 40, 0.5); border-color: #b08d4b; }

        #text-box {
            min-height: 90px; font-size: 14px; line-height: 1.8;
            color: #b8b8b8; white-space: pre-wrap; letter-spacing: 0.5px;
            border-left: 2px solid #333; padding-left: 12px; flex-shrink: 0;
        }
        .cursor { display: inline-block; width: 5px; height: 15px; background: #b8b8b8; animation: blink 1s step-end infinite; vertical-align: middle; }
        @keyframes blink { 50% { opacity: 0; } }

        #toast {
            position: fixed; top: 15px; left: 50%; transform: translateX(-50%);
            background: rgba(211, 94, 94, 0.95); color: #fff; padding: 8px 16px;
            border-radius: 4px; font-size: 13px; opacity: 0; transition: opacity 0.3s;
            pointer-events: none; z-index: 400; text-align: center; max-width: 90%;
        }
        #toast.show { opacity: 1; }
        #toast.warm { background: rgba(180, 140, 70, 0.95); }

        #toolbar { display: flex; justify-content: space-between; font-size: 11px; color: #555; padding-top: 8px; border-top: 1px solid rgba(255,255,255,0.05); flex-shrink: 0; }
        .tool-btn { background: none; border: none; color: #555; cursor: pointer; font-family: inherit; font-size: 11px; transition: color 0.3s; }
        .tool-btn:hover { color: #aaa; }

        /* ========== 反应力小游戏 ========== */
        #minigame-screen {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            z-index: 500;
            display: none;
            justify-content: center; align-items: center;
            flex-direction: column;
            cursor: pointer;
            user-select: none;
            background: rgba(20, 20, 20, 0.95);
            transition: background 0.15s;
            -webkit-tap-highlight-color: transparent;
        }
        #minigame-content { text-align: center; padding: 30px; }
        .mg-status { font-size: 22px; color: #ddd; letter-spacing: 4px; }
        .mg-danger { font-size: 34px; color: #fff; font-weight: bold; letter-spacing: 4px; animation: shake 0.2s infinite; }
        .mg-hint { font-size: 13px; color: #aaa; margin-top: 15px; letter-spacing: 2px; }
        .mg-round { font-size: 11px; color: #666; margin-top: 8px; letter-spacing: 3px; }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-6px); }
            75% { transform: translateX(6px); }
        }

        /* ========== 结局图鉴 ========== */
        .ending-list { display: flex; flex-direction: column; gap: 10px; max-height: 60vh; overflow-y: auto; padding-right: 5px; }
        .ending-item {
            background: rgba(30,30,30,0.7); border: 1px solid #333;
            border-radius: 4px; padding: 12px 15px; font-size: 13px;
            display: flex; justify-content: space-between; align-items: center;
            transition: all 0.3s;
        }
        .ending-item.unlocked { border-color: #6b9e6b; color: #b8d8b8; }
        .ending-item.locked { color: #444; }
        .ending-item .ending-name { letter-spacing: 2px; }
        .ending-item .ending-tag { font-size: 11px; color: #666; }
        .ending-item.unlocked .ending-tag { color: #6b9e6b; }
    </style>
</head>
<body>

<div id="name-screen">
    <h1>沉没的十七岁</h1>
    <p>请输入你的名字</p>
    <input type="text" id="player-name-input" placeholder="你的名字" maxlength="10">
    <button onclick="startGame()">开始高三</button>
</div>

<div id="game-container">
    <div class="top-bar">
        <button class="top-btn" id="btn-chat" onclick="openPhone()">💬 聊天 <span class="badge" id="phone-badge" style="display:none;">!</span></button>
        <button class="top-btn" id="audio-toggle" onclick="toggleAudio()">🔇 环境音：关</button>
    </div>
    <div id="stats">
        <div class="stat-item">月份 <span id="stat-month" class="stat-value">9月</span></div>
        <div class="stat-item">压力 <span id="stat-stress" class="stat-value">20</span></div>
        <div class="stat-item">精力 <span id="stat-energy" class="stat-value">80</span></div>
        <div class="stat-item">孔老师 <span id="stat-kong" class="stat-value stat-warm">65</span></div>
    </div>

    <div id="subjects-panel">
        <div class="subject-row"><span class="subject-name">语文</span><div class="subject-bar-bg"><div id="bar-chinese" class="subject-bar-fill"></div></div><span id="val-chinese" class="subject-val">50</span></div>
        <div class="subject-row"><span class="subject-name">数学</span><div class="subject-bar-bg"><div id="bar-math" class="subject-bar-fill"></div></div><span id="val-math" class="subject-val">50</span></div>
        <div class="subject-row"><span class="subject-name">英语</span><div class="subject-bar-bg"><div id="bar-english" class="subject-bar-fill"></div></div><span id="val-english" class="subject-val">50</span></div>
        <div class="subject-row"><span class="subject-name">综合</span><div class="subject-bar-bg"><div id="bar-comprehensive" class="subject-bar-fill"></div></div><span id="val-comprehensive" class="subject-val">50</span></div>
    </div>

    <div id="relief-panel">
        <h3>本月压力释放计划</h3>
        <div class="relief-grid">
            <button class="relief-btn" onclick="selectRelief('rest')">💤 休息</button>
            <button class="relief-btn" onclick="selectRelief('music')">🎵 听音乐</button>
            <button class="relief-btn" onclick="selectRelief('walk')">🚶 散步</button>
            <button class="relief-btn risky" onclick="selectRelief('phone')">📱 玩手机（一次失败即被发现）</button>
            <button class="relief-btn risky" onclick="selectRelief('skip')">🏃 逃课（一次失败即被发现）</button>
        </div>
    </div>

    <div id="feed-scroll"></div>
    <div id="text-box"></div>
    <div id="options"></div>

    <div id="toolbar">
        <button class="tool-btn" id="btn-save">💾 存档</button>
        <button class="tool-btn" id="btn-load">📂 读档</button>
        <button class="tool-btn" onclick="resetGame()">🔄 重来</button>
    </div>
</div>

<div id="phone-screen">
    <div id="phone-header">
        <h2>聊天</h2>
        <button onclick="closePhone()">✕</button>
    </div>
    <div id="phone-content"></div>
    <div id="chat-detail">
        <div id="chat-detail-header">
            <button onclick="backToChats()">←</button>
            <span id="chat-detail-name">聊天</span>
        </div>
        <div id="chat-messages"></div>
        <div id="chat-options"></div>
    </div>
</div>

<div id="minigame-screen">
    <div id="minigame-content"></div>
</div>

<div id="toast"></div>

<script>
    // ================= 音频 =================
    let audioCtx = null, rainSource = null, chatterSource = null, audioEnabled = false;
    function initAudio() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
    function toggleAudio() {
        initAudio();
        const btn = document.getElementById('audio-toggle');
        if (audioEnabled) {
            if (rainSource) { rainSource.stop(); rainSource = null; }
            if (chatterSource) { chatterSource.stop(); chatterSource = null; }
            audioEnabled = false; btn.textContent = '🔇 环境音：关'; btn.classList.remove('active');
        } else {
            const rainBuffer = audioCtx.createBuffer(1, audioCtx.sampleRate * 2, audioCtx.sampleRate);
            const rainData = rainBuffer.getChannelData(0);
            for (let i = 0; i < rainData.length; i++) rainData[i] = Math.random() * 2 - 1;
            rainSource = audioCtx.createBufferSource(); rainSource.buffer = rainBuffer; rainSource.loop = true;
            const rainFilter = audioCtx.createBiquadFilter(); rainFilter.type = 'lowpass'; rainFilter.frequency.value = 800;
            const rainGain = audioCtx.createGain(); rainGain.gain.value = 0.08;
            rainSource.connect(rainFilter); rainFilter.connect(rainGain); rainGain.connect(audioCtx.destination); rainSource.start();

            const chatterBuffer = audioCtx.createBuffer(1, audioCtx.sampleRate * 2, audioCtx.sampleRate);
            const chatterData = chatterBuffer.getChannelData(0);
            let lastOut = 0;
            for (let i = 0; i < chatterData.length; i++) {
                const white = Math.random() * 2 - 1;
                chatterData[i] = (lastOut + (0.02 * white)) / 1.02; lastOut = chatterData[i]; chatterData[i] *= 3.5;
            }
            chatterSource = audioCtx.createBufferSource(); chatterSource.buffer = chatterBuffer; chatterSource.loop = true;
            const chatterFilter = audioCtx.createBiquadFilter(); chatterFilter.type = 'bandpass'; chatterFilter.frequency.value = 1000; chatterFilter.Q.value = 0.5;
            const chatterGain = audioCtx.createGain(); chatterGain.gain.value = 0.04;
            chatterSource.connect(chatterFilter); chatterFilter.connect(chatterGain); chatterGain.connect(audioCtx.destination); chatterSource.start();
            audioEnabled = true; btn.textContent = '🔊 环境音：开'; btn.classList.add('active');
        }
    }

    // ================= 背景图库 =================
    // 图片来源：Unsplash (https://unsplash.com) — 依据 Unsplash License 使用
    const backgrounds = {
        classroom: 'https://images.unsplash.com/photo-1580582932707-520aed937b7b?q=80&w=1000&auto=format&fit=crop',
        corridor: 'https://images.unsplash.com/photo-1509228468518-180dd4864904?q=80&w=1000&auto=format&fit=crop',
        rain: 'https://images.unsplash.com/photo-1519692933481-e7c6d3e6a6f6?q=80&w=1000&auto=format&fit=crop',
        night: 'https://images.unsplash.com/photo-1507400492013-162706c8c05e?q=80&w=1000&auto=format&fit=crop',
        exam: 'https://images.unsplash.com/photo-1434030216411-0b793f4b4173?q=80&w=1000&auto=format&fit=crop',
        dorm: 'https://images.unsplash.com/photo-1519681393784-d120267933ba?q=80&w=1000&auto=format&fit=crop'
    };
    function setBackground(scene) { if (backgrounds[scene]) document.body.style.backgroundImage = `url('${backgrounds[scene]}')`; }

    // ================= 题库 =================
    const questionBank = {
        chinese: [

            else { clearInterval(typeTimer); box.innerHTML += '<span class="cursor"></span>'; if (callback) callback(); }
        }, 15);
    }

    function handleInteraction(cardIndex, actionIndex) {
        const feed = feedDatabase[state.month];
        if (!feed || !feed[cardIndex]) return;
        const action = feed[cardIndex].interactions[actionIndex];
        if (state.feedInteracted[cardIndex]) { showToast('你已经回应过这条了。'); return; }
        if (action.effect) {
            state.energy = Math.max(0, state.energy + (action.effect.energy || 0));
            state.stress = Math.max(0, Math.min(100, state.stress + (action.effect.stress || 0)));
        }
        state.feedInteracted[cardIndex] = true;
        const card = document.getElementById(`feed-card-${cardIndex}`);
        card.querySelectorAll('.action-btn').forEach(btn => btn.disabled = true);
        const selectedBtn = card.querySelector(`.action-btn[data-action="${actionIndex}"]`);
        if (selectedBtn) selectedBtn.classList.add('selected');
        const replyBox = document.getElementById(`replies-${cardIndex}`);
        replyBox.innerHTML = `<div><span>你：</span>${action.reply}</div>`;
        replyBox.classList.add('show'); updateSubjectUI();
    }

    function startReactionGame(type, callback) {
        const config = type === 'phone'
            ? { rounds: 3, window: 1500, name: '偷偷玩手机', riskText: '⚠ 班主任来了！', }
            : { rounds: 4, window: 1100, name: '逃课', riskText: '⚠ 班主任巡视！' };

        const screen = document.getElementById('minigame-screen');
        const content = document.getElementById('minigame-content');
        let round = 0;
        let failed = false;
        screen.style.display = 'flex';

        function startRound() {
            if (failed || round >= config.rounds) { endGame(!failed); return; }
            content.innerHTML = `<div class="mg-status">${config.name}中...</div><div class="mg-hint">保持警惕，随时点击屏幕</div><div class="mg-round">第 ${round + 1} / ${config.rounds} 次</div>`;
            screen.style.background = 'rgba(20, 20, 20, 0.95)';

            const delay = 800 + Math.random() * 2000;
            setTimeout(() => {
                if (failed) return;
                content.innerHTML = `<div class="mg-danger">${config.riskText}</div><div class="mg-hint">快速点击屏幕！</div>`;
                screen.style.background = 'rgba(120, 30, 30, 0.95)';

                let resolved = false;
                const clickHandler = () => {
                    if (resolved) return;
                    resolved = true;
                    screen.removeEventListener('click', clickHandler);
                    clearTimeout(failTimer);
                    round++;
                    setTimeout(startRound, 300);
                };
                screen.addEventListener('click', clickHandler);

                const failTimer = setTimeout(() => {
                    if (resolved) return;
                    resolved = true;
                    failed = true;
                    screen.removeEventListener('click', clickHandler);
                    content.innerHTML = `<div class="mg-danger">❌ 被发现了！</div>`;
                    screen.style.background = 'rgba(80, 20, 20, 0.95)';
                    setTimeout(() => { endGame(false); }, 900);
                }, config.window);
            }, delay);
        }

        function endGame(success) {
            screen.style.display = 'none';
            screen.style.background = 'rgba(20, 20, 20, 0.95)';
            content.innerHTML = '';
            callback(success);
        }

        startRound();
    }

            document.getElementById('relief-panel').style.display = 'none';
            document.getElementById('text-box').style.display = 'block'; setBackground('night');

                renderOptions([{ text: "拿起笔", next: 'start_exam' }]);

            if (kongMoments[state.month] && !state.kongMomentsShown[state.month]) {
                showKongMoment(state.month, showNext);
            } else {

            }
        };

        if (state.month === 3 && !state.exam12Done) {

    // ================= 高考 =================
    function generateExam() {
        const examQuestions = [];
        ['chinese', 'math', 'english', 'comprehensive'].forEach(sub => {
            const pool = questionBank[sub];
            examQuestions.push({ subject: sub, ...pool[Math.floor(Math.random() * pool.length)] });
        });
        state.exam.questions = examQuestions.sort(() => Math.random() - 0.5);
        state.exam.currentQ = 0;
        state.exam.scores = { chinese: 0, math: 0, english: 0, comprehensive: 0 };
        state.currentPhase = 'exam'; render();
    }

    function finishExam() {
        state.currentPhase = 'ending';
        const baseScores = state.subjects; const examScores = state.exam.scores;
        let finalTotal = 0; let subjectResults = [];
        ['chinese', 'math', 'english', 'comprehensive'].forEach(sub => {
            const base = Math.floor(baseScores[sub] * 1.5);
            const exam = examScores[sub] * 10;
            const total = base + exam; finalTotal += total;
            subjectResults.push(`${subjectNames[sub]}：${total} 分`);
        });

        const scoreText = `考试结束。\n\n你放下笔，整个人像被抽空。\n\n—————— 高考成绩 ——————\n\n${subjectResults.join('\n')}\n\n总分：${finalTotal} / 700\n\n`;

        setBackground('night');
        document.getElementById('text-box').style.display = 'block';
        document.getElementById('relief-panel').style.display = 'none';
        document.getElementById('subjects-panel').style.display = 'none';
        document.getElementById('feed-scroll').style.display = 'none';

        typeWriter(scoreText, () => {
            const optionsBox = document.getElementById('options');
            optionsBox.innerHTML = '';
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = finalTotal >= 500 ? '>> 参加毕业典礼' : '>> 面对结局';
            btn.onclick = () => {
                if (finalTotal >= 500) showGraduationCeremony(finalTotal);
                else showFinalEnding(finalTotal);
            };
            optionsBox.appendChild(btn);
        });
    }

    // ================= 毕业典礼演讲 =================
    function showGraduationCeremony(finalTotal) {
        setBackground('corridor');
        let text = `六月末。毕业典礼。\n\n礼堂里坐满了人。\n\n校长念完优秀毕业生名单，主持的老师说：\n\n“下面有请学生代表发言。”\n\n有人推了推你的肩膀。\n\n你站起来，走上了台。\n\n你站在话筒前，看着台下。\n\n几百个人，几百张脸。\n\n你想说的话很多，但最后只说了一句：\n\n“谢谢大家。谢谢这三年。”\n\n台下响起掌声。\n\n你走下来的时候，看见孔老师站在最后一排。\n\n他也鼓着掌。`;
        typeWriter(text, () => {
            const optionsBox = document.getElementById('options');
            optionsBox.innerHTML = '';
            const btn = document.createElement('button');
            btn.className = 'option-btn warm';
            btn.innerText = '>> 典礼结束了';
            btn.onclick = () => showGroupPhoto(finalTotal);
            optionsBox.appendChild(btn);
        });
    }

    // ================= 合照 =================
    function showGroupPhoto(finalTotal) {
        setBackground('corridor');
        let text = `典礼结束后，同学们在操场上合影。\n\n有人在喊：“孔老师，一起拍一张！”\n\n孔老师走过来，站在人群边缘。\n\n大家都往中间挤。你没动，站在原来的位置。\n\n快门按下的那一刻，你想说点什么，但什么也没说出来。\n\n照片洗出来后，你把它夹在日记本里。\n\n很多年以后，你还会拿出来看。\n\n孔老师站在最边上，微微地笑着。\n\n——在那个所有老师都看重成绩的三年里，只有他，不管你考多少分，都把你当成一个人来尊重。\n\n他从来没有对你说过一句重话。也从来没有因为你成绩不好而少看你一眼。`;
        if (state.kong >= 85) {
            text += `\n\n你后来才明白，那种尊重，比任何一句表扬都难得。`;
        }
        typeWriter(text, () => {
            const optionsBox = document.getElementById('options');
            optionsBox.innerHTML = '';
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = '>> 结局';
            btn.onclick = () => showFinalEnding(finalTotal);
            optionsBox.appendChild(btn);
        });
    }

    // ================= 不同结局 =================
    function showFinalEnding(finalTotal) {
        setBackground('night');
        let endingTitle = "";
        let endingText = "";
        let endingId = "";

        if (finalTotal >= 600) {
            endingId = 'light';
            endingTitle = "结局 · 站在光里";
            endingText = "你考上了一所 985/211。\n\n所有人都在恭喜你。\n\n父母请亲戚吃了饭，席间反反复复地说着“我们家孩子”。\n\n你笑着，说了很多次谢谢。\n\n但只有你知道，这三年，你丢掉的东西，比得到的更多。";
        } else if (finalTotal >= 500) {
            endingId = 'ashore';
            endingTitle = "结局 · 上岸";
            endingText = "你考上了一所一本。\n\n父母很高兴。\n\n亲戚们纷纷打电话来。\n\n你坐在自己房间里，看着窗外的天。\n\n不知道自己在想什么。";
        } else if (finalTotal >= 400) {
            endingId = 'lukewarm';
            endingTitle = "结局 · 温吞";
            endingText = "你考上了一所普通本科。\n\n不算好，也不算差。\n\n你想起三年前刚入学时，自己说过的话。\n\n好像是很久以前的事了。";
        } else if (finalTotal >= 300) {
            endingId = 'make_do';
            endingTitle = "结局 · 将就";
            endingText = "你上了一所专科。\n\n亲戚问起时，父母只能含糊地说“还在读”。\n\n你没有反驳什么。\n\n只是偶尔会想，如果那几个月再努力一点，会不会不一样。";
        } else {
            endingId = 'fail';
            endingTitle = "结局 · 落榜";
            endingText = "你落榜了。\n\n家里弥漫着死一般的寂静。\n\n你把自己关在房间里，看着窗外的天。\n\n不知道未来在哪里。";
        }

        unlockEnding(endingId);

        if (state.kong >= 85 && finalTotal < 500) {
            endingText += "\n\n————————\n\n毕业典礼那天，你在走廊里遇到了孔老师。\n\n“孔老师好。”你说。\n\n他点点头，像三年前那个开学第一天一样。\n\n“再见啊。”他说。\n\n然后就走了。\n\n你站在原地，看着他的背影转过走廊的拐角。\n\n忽然想起拔草那天、大扫除那天、你站起来回答问题那天——\n\n他好像一直都是这样，不声不响地，把该做的都做了。\n\n他从来没有因为你的成绩差，就少看你一眼。\n\n你张了张嘴，那声“谢谢”最终没能说出口。";
        }

        const fullText = `【${endingTitle}】\n\n${endingText}`;
        typeWriter(fullText, () => {
            setTimeout(showEndingGallery, 1500);
        });
    }

    // ================= 结局图鉴 =================
    function showEndingGallery() {
        state.currentPhase = 'ending_gallery';
        setBackground('night');
        document.getElementById('feed-scroll').style.display = 'none';
        document.getElementById('relief-panel').style.display = 'none';
        document.getElementById('subjects-panel').style.display = 'none';
        document.getElementById('text-box').style.display = 'none';
        document.getElementById('options').style.display = 'none';

        const optionsBox = document.getElementById('options');
        optionsBox.innerHTML = '';
        optionsBox.style.display = 'flex';

        let html = `<div style="font-size:14px;color:#d3a75e;letter-spacing:3px;margin-bottom:12px;text-align:center;">—————— 结局图鉴 ——————</div>`;
        html += `<div class="ending-list">`;
        allEndings.forEach(e => {
            const unlocked = state.unlockedEndings[e.id];
            html += `<div class="ending-item ${unlocked ? 'unlocked' : 'locked'}">
                <div>
                    <div class="ending-name">${unlocked ? '✓ ' + e.name : '？？？'}</div>
                    <div class="ending-tag">${unlocked ? e.desc : '未解锁'}</div>
                </div>
                <div class="ending-tag">${unlocked ? '已解锁' : '—'}</div>
            </div>`;
        });
        html += `</div>`;
        html += `<div style="text-align:center;font-size:12px;color:#666;margin-top:15px;letter-spacing:2px;">已解锁 ${Object.keys(state.unlockedEndings).filter(k => allEndings.find(e => e.id === k)).length} / ${allEndings.length}</div>`;

        const container = document.createElement('div');
        container.style.width = '100%';
        container.innerHTML = html;
        optionsBox.appendChild(container);

        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.style.marginTop = '15px';
        btn.innerText = '>> 重来一次';
        btn.onclick = () => resetGame();
        optionsBox.appendChild(btn);
    }

    // ================= 渲染 =================
    function render() {
        document.getElementById('stat-month').textContent = monthNames[state.month] || '6月';
        updateSubjectUI();
        const panel = document.getElementById('subjects-panel');
        const reliefPanel = document.getElementById('relief-panel');
        const optionsBox = document.getElementById('options');
        const textBox = document.getElementById('text-box');
        const feedScroll = document.getElementById('feed-scroll');

        if (state.currentPhase === 'planning') {
            if (canTutor()) {
                showTutoringPanel();
                return;
            }

            feedScroll.style.display = 'none'; textBox.style.display = 'block';
            panel.style.display = 'block'; setBackground('classroom');
            textBox.innerHTML = `【${monthNames[state.month]}】\n\n这个月，你决定主攻哪一科？\n\n（主攻科目大幅提升，其他科目掉分。请谨慎选择。）`;
            optionsBox.style.display = 'flex'; optionsBox.innerHTML = '';
            ['chinese', 'math', 'english', 'comprehensive'].forEach(sub => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = subjectNames[sub];
                btn.onclick = () => {
                    state.selectedSubject = sub;
                    Array.from(optionsBox.children).forEach(b => b.classList.remove('selected'));
                    btn.classList.add('selected');
                    reliefPanel.style.display = 'flex';
                    let endBtn = document.getElementById('end-month-btn');
                    if (endBtn) endBtn.remove();
                    endBtn = document.createElement('button');
                    endBtn.id = 'end-month-btn'; endBtn.className = 'option-btn';
                    endBtn.style.borderColor = '#6b9e6b'; endBtn.style.color = '#b8d8b8';
                    endBtn.innerText = '>> 结束本月，迎接考试与审判 <<';
                    endBtn.onclick = advanceMonth; optionsBox.appendChild(endBtn);
                };
                optionsBox.appendChild(btn);
            });
        } else if (state.currentPhase === 'exam') {
            feedScroll.style.display = 'none'; reliefPanel.style.display = 'none';
            textBox.style.display = 'block'; panel.style.display = 'none';
            optionsBox.style.display = 'flex'; setBackground('exam');
            const q = state.exam.questions[state.exam.currentQ];
            if (!q) return;
            textBox.innerHTML = `【高考 · 第 ${state.exam.currentQ + 1} / ${state.exam.questions.length} 题】\n\n` +
                `科目：${subjectNames[q.subject]}\n\n` +
                `题目：${q.q}`;
            optionsBox.innerHTML = '';
            q.a.forEach((answerText, index) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn'; btn.innerText = answerText;
                btn.onclick = () => {
                    if (index === q.correct) { state.exam.scores[q.subject] += 3; showToast(`✅ 答对，${subjectNames[q.subject]} +3`); }
                    else { showToast(`❌ 答错，${subjectNames[q.subject]} +0`); }
                    state.exam.currentQ++;
                    if (state.exam.currentQ >= state.exam.questions.length) finishExam();
                    else render();
                };
                optionsBox.appendChild(btn);
            });
        }
    }

    function renderOptions(opts) {
        const optionsBox = document.getElementById('options'); optionsBox.innerHTML = '';
        opts.forEach(opt => {
            const btn = document.createElement('button');
            btn.className = 'option-btn'; btn.innerText = opt.text;
            btn.onclick = () => { if (opt.next === 'reset') resetGame(); if (opt.next === 'start_exam') generateExam(); };
            optionsBox.appendChild(btn);
        });
    }

    function saveGame() { localStorage.setItem('gaokao_save', JSON.stringify(state)); showToast('已存档'); }
    function loadGame() {
        const saved = localStorage.getItem('gaokao_save');
        if (saved) {
            state = JSON.parse(saved);
            if (!state.kongMomentsShown) state.kongMomentsShown = {};
            if (!state.unlockedEndings) state.unlockedEndings = loadUnlockedEndings();
            if (!state.tutoringUsed) state.tutoringUsed = {};
            render(); checkBadges(); showToast('读档成功');
        } else { showToast('没有找到存档'); }
    }
    function resetGame() {
        const savedEndings = state.unlockedEndings || loadUnlockedEndings();
        state = {
            playerName: state.playerName || "同学", month: 0, stress: 20, energy: 80, kong: 65,
            subjects: { chinese: 50, math: 50, english: 50, comprehensive: 50 },
            currentPhase: 'planning', selectedSubject: null, selectedRelief: null,
            feedInteracted: {}, exam12Done: false, monthlyExam: null,
            kongMomentsShown: {}, lastRank: null,
            chatReplied: {}, exam: { currentQ: 0, scores: {}, questions: [] },
            unlockedEndings: savedEndings,
            tutoringUsed: {}
        };
        localStorage.removeItem('gaokao_save');
        document.getElementById('feed-scroll').style.display = 'none';
        document.getElementById('relief-panel').style.display = 'none';
        setBackground('classroom');
        if (kongMoments[0] && !state.kongMomentsShown[0]) {
            showKongMoment(0, () => { render(); checkBadges(); });
        } else {
            render(); checkBadges();
        }
    }

    document.getElementById('btn-save').onclick = saveGame;
    document.getElementById('btn-load').onclick = loadGame;
    document.getElementById('game-container').style.display = 'none';
</script>
</body>
</html>
